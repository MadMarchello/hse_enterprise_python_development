[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-classifier"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "pillow",
    "matplotlib",
    "python-dotenv",
]

[tool.setuptools]
packages = ["dog_classifier"]

[tool.setuptools.package-dir]
dog_classifier = "."
